<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      color: #58a6ff;
    }

    .logo svg { width: 28px; height: 28px; fill: #58a6ff; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .market-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #3fb950;
      background: rgba(63,185,80,.12);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(63,185,80,.3);
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    .clock { font-size: 13px; color: #8b949e; }

    /* ── LAYOUT ── */
    .container { padding: 24px 32px; }

    /* ── TICKER TAPE ── */
    .ticker-wrap {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 24px;
      padding: 10px 0;
    }

    .ticker-content {
      display: flex;
      gap: 48px;
      white-space: nowrap;
      animation: scroll 30s linear infinite;
    }

    .ticker-wrap:hover .ticker-content { animation-play-state: paused; }

    @keyframes scroll {
      from { transform: translateX(100%); }
      to   { transform: translateX(-100%); }
    }

    .ticker-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .ticker-item .sym  { font-weight: 700; color: #e6edf3; }
    .ticker-item .price { color: #8b949e; }
    .ticker-item .chg.up   { color: #3fb950; }
    .ticker-item .chg.down { color: #f85149; }

    /* ── KPI CARDS ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 12px;
      padding: 20px;
      transition: border-color .2s, transform .2s;
    }

    .kpi-card:hover { border-color: #58a6ff; transform: translateY(-2px); }

    .kpi-label { font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 8px; }
    .kpi-value { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
    .kpi-change { font-size: 13px; display: flex; align-items: center; gap: 4px; }
    .kpi-change.up   { color: #3fb950; }
    .kpi-change.down { color: #f85149; }

    /* ── MAIN GRID ── */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      margin-bottom: 24px;
    }

    /* ── CHART CARD ── */
    .chart-card {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 12px;
      padding: 24px;
    }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .chart-title { font-size: 16px; font-weight: 600; }
    .chart-sub   { font-size: 12px; color: #8b949e; margin-top: 2px; }

    .range-btns { display: flex; gap: 6px; }

    .range-btn {
      background: none;
      border: 1px solid #21262d;
      color: #8b949e;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all .2s;
    }

    .range-btn.active,
    .range-btn:hover {
      background: #58a6ff;
      border-color: #58a6ff;
      color: #fff;
    }

    canvas { width: 100% !important; }

    /* ── WATCHLIST ── */
    .watchlist-card {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 12px;
      padding: 20px;
      overflow-y: auto;
      max-height: 460px;
    }

    .watchlist-card::-webkit-scrollbar { width: 4px; }
    .watchlist-card::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

    .section-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; }

    .wl-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #21262d;
      cursor: pointer;
      transition: background .15s;
      border-radius: 6px;
    }

    .wl-item:last-child { border-bottom: none; }
    .wl-item:hover { background: rgba(88,166,255,.05); padding-left: 8px; }

    .wl-left { display: flex; align-items: center; gap: 12px; }

    .stock-icon {
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff;
    }

    .wl-sym   { font-weight: 600; font-size: 14px; }
    .wl-name  { font-size: 11px; color: #8b949e; margin-top: 2px; }
    .wl-right { text-align: right; }
    .wl-price { font-weight: 600; font-size: 14px; }
    .wl-chg   { font-size: 12px; margin-top: 2px; }
    .wl-chg.up   { color: #3fb950; }
    .wl-chg.down { color: #f85149; }

    /* ── BOTTOM GRID ── */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    /* ── TABLE ── */
    .table-card {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 12px;
      padding: 20px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      text-align: left;
      padding: 8px 10px;
      color: #8b949e;
      font-weight: 500;
      border-bottom: 1px solid #21262d;
      text-transform: uppercase;
      font-size: 11px;
    }

    tbody tr { transition: background .15s; }
    tbody tr:hover { background: rgba(88,166,255,.05); }
    tbody td { padding: 12px 10px; border-bottom: 1px solid #21262d; }
    tbody tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge.buy  { background: rgba(63,185,80,.15);  color: #3fb950; }
    .badge.sell { background: rgba(248,81,73,.15);  color: #f85149; }
    .badge.hold { background: rgba(227,179,65,.15); color: #e3b341; }

    /* ── PIE CARD ── */
    .pie-card {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .pie-wrapper {
      display: flex;
      align-items: center;
      gap: 24px;
      flex: 1;
      margin-top: 12px;
    }

    .pie-wrapper canvas { max-width: 180px; max-height: 180px; }

    .pie-legend { display: flex; flex-direction: column; gap: 10px; }

    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .legend-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-pct  { font-weight: 600; margin-left: auto; padding-left: 16px; }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 20px;
      color: #8b949e;
      font-size: 12px;
      border-top: 1px solid #21262d;
      margin-top: 8px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .main-grid   { grid-template-columns: 1fr; }
      .bottom-grid { grid-template-columns: 1fr; }
      .container   { padding: 16px; }
    }
  </style>
</head>
<body>

<!-- ════════════ HEADER ════════════ -->
<header>
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M3 17l4-8 4 4 4-6 4 10"/></svg>
    StockPulse
  </div>
  <div class="header-right">
    <div class="market-status"><span class="dot"></span> Market Open</div>
    <div class="clock" id="clock">--:--:-- AM</div>
  </div>
</header>

<!-- ════════════ MAIN ════════════ -->
<div class="container">

  <!-- TICKER TAPE -->
  <div class="ticker-wrap">
    <div class="ticker-content" id="tickerContent"></div>
  </div>

  <!-- KPI CARDS -->
  <div class="kpi-grid" id="kpiGrid"></div>

  <!-- CHART + WATCHLIST -->
  <div class="main-grid">
    <div class="chart-card">
      <div class="chart-header">
        <div>
          <div class="chart-title" id="chartTitle">AAPL – Apple Inc.</div>
          <div class="chart-sub" id="chartSub">NASDAQ &nbsp;·&nbsp; Real-time simulation</div>
        </div>
        <div class="range-btns" id="rangeBtns">
          <button class="range-btn active" data-range="1D">1D</button>
          <button class="range-btn" data-range="1W">1W</button>
          <button class="range-btn" data-range="1M">1M</button>
          <button class="range-btn" data-range="3M">3M</button>
          <button class="range-btn" data-range="1Y">1Y</button>
        </div>
      </div>
      <canvas id="lineChart" height="220"></canvas>
    </div>

    <div class="watchlist-card">
      <div class="section-title">⭐ Watchlist</div>
      <div id="watchlist"></div>
    </div>
  </div>

  <!-- TABLE + PIE -->
  <div class="bottom-grid">
    <div class="table-card">
      <div class="section-title">📋 Recent Trades</div>
      <table>
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Value</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tradeTable"></tbody>
      </table>
    </div>

    <div class="pie-card">
      <div class="section-title">🥧 Portfolio Allocation</div>
      <div class="pie-wrapper">
        <canvas id="pieChart"></canvas>
        <div class="pie-legend" id="pieLegend"></div>
      </div>
    </div>
  </div>

</div>

<footer>StockPulse Dashboard &nbsp;·&nbsp; Data is simulated for demonstration purposes &nbsp;·&nbsp; © 2025</footer>

<!-- ════════════ SCRIPTS ════════════ -->
<script>
  /* ─── DATA ─── */
  const stocks = [
    { sym:'AAPL', name:'Apple Inc.',        price:189.45, chg:+1.23, pct:+0.65, color:'#58a6ff' },
    { sym:'MSFT', name:'Microsoft Corp.',   price:415.82, chg:+3.17, pct:+0.77, color:'#3fb950' },
    { sym:'GOOGL',name:'Alphabet Inc.',     price:175.60, chg:-1.44, pct:-0.81, color:'#d2a8ff' },
    { sym:'AMZN', name:'Amazon.com Inc.',   price:224.31, chg:+2.89, pct:+1.30, color:'#ffa657' },
    { sym:'TSLA', name:'Tesla Inc.',        price:248.90, chg:-5.60, pct:-2.20, color:'#f85149' },
    { sym:'NVDA', name:'NVIDIA Corp.',      price:875.43, chg:+12.7, pct:+1.47, color:'#79c0ff' },
    { sym:'META', name:'Meta Platforms',    price:512.76, chg:+4.52, pct:+0.89, color:'#a5d6ff' },
    { sym:'BRK',  name:'Berkshire Hathaway',price:620.15, chg:+0.80, pct:+0.13, color:'#e3b341' },
  ];

  const kpiData = [
    { label:'Portfolio Value', value:'$142,380', change:'+$1,840', up:true  },
    { label:'Day\'s Gain',     value:'+$1,840',  change:'+1.31%',  up:true  },
    { label:'Total Return',    value:'$28,450',  change:'+24.97%', up:true  },
    { label:'Open Positions',  value:'12',       change:'3 today', up:true  },
  ];

  const trades = [
    { sym:'NVDA', price:875.43, qty:5,  action:'buy'  },
    { sym:'TSLA', price:254.50, qty:10, action:'sell' },
    { sym:'AAPL', price:188.22, qty:15, action:'buy'  },
    { sym:'MSFT', price:412.60, qty:8,  action:'hold' },
    { sym:'AMZN', price:221.80, qty:3,  action:'buy'  },
  ];

  const portfolio = [
    { label:'Technology', pct:42, color:'#58a6ff' },
    { label:'Consumer',   pct:22, color:'#3fb950' },
    { label:'Healthcare', pct:16, color:'#d2a8ff' },
    { label:'Finance',    pct:13, color:'#ffa657' },
    { label:'Energy',     pct: 7, color:'#e3b341' },
  ];

  /* ─── CLOCK ─── */
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('en-US');
  }
  updateClock();
  setInterval(updateClock, 1000);

  /* ─── TICKER ─── */
  const tickerEl = document.getElementById('tickerContent');
  [...stocks, ...stocks].forEach(s => {
    const div = document.createElement('div');
    div.className = 'ticker-item';
    const up = s.chg >= 0;
    div.innerHTML = `
      <span class="sym">${s.sym}</span>
      <span class="price">$${s.price.toFixed(2)}</span>
      <span class="chg ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(s.pct).toFixed(2)}%</span>`;
    tickerEl.appendChild(div);
  });

  /* ─── KPI ─── */
  const kpiGrid = document.getElementById('kpiGrid');
  kpiData.forEach(k => {
    kpiGrid.innerHTML += `
      <div class="kpi-card">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value">${k.value}</div>
        <div class="kpi-change ${k.up?'up':'down'}">${k.up?'▲':'▼'} ${k.change}</div>
      </div>`;
  });

  /* ─── WATCHLIST ─── */
  const wlEl = document.getElementById('watchlist');
  let activeStock = stocks[0];

  function renderWatchlist() {
    wlEl.innerHTML = '';
    stocks.forEach(s => {
      const up = s.chg >= 0;
      const item = document.createElement('div');
      item.className = 'wl-item';
      item.innerHTML = `
        <div class="wl-left">
          <div class="stock-icon" style="background:${s.color}22;color:${s.color}">${s.sym.slice(0,2)}</div>
          <div>
            <div class="wl-sym">${s.sym}</div>
            <div class="wl-name">${s.name}</div>
          </div>
        </div>
        <div class="wl-right">
          <div class="wl-price">$${s.price.toFixed(2)}</div>
          <div class="wl-chg ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(s.pct).toFixed(2)}%</div>
        </div>`;
      item.addEventListener('click', () => {
        activeStock = s;
        document.getElementById('chartTitle').textContent = `${s.sym} – ${s.name}`;
        updateChart();
      });
      wlEl.appendChild(item);
    });
  }
  renderWatchlist();

  /* ─── CHART DATA GENERATOR ─── */
  function genPrices(base, points, volatility = 0.012) {
    const arr = [base];
    for (let i = 1; i < points; i++) {
      const prev = arr[i-1];
      arr.push(+(prev * (1 + (Math.random() - 0.48) * volatility)).toFixed(2));
    }
    return arr;
  }

  function genLabels(range) {
    const labels = [];
    const now = new Date();
    const configs = {
      '1D': { pts:78,  unit:'min',  step:5   },
      '1W': { pts:35,  unit:'day',  step:0.2 },
      '1M': { pts:30,  unit:'day',  step:1   },
      '3M': { pts:90,  unit:'day',  step:1   },
      '1Y': { pts:52,  unit:'week', step:1   },
    };
    const { pts, unit } = configs[range] || configs['1D'];
    for (let i = pts; i >= 0; i--) {
      const d = new Date(now);
      if (unit==='min')  d.setMinutes(d.getMinutes() - i * 5);
      if (unit==='day')  d.setDate(d.getDate() - i);
      if (unit==='week') d.setDate(d.getDate() - i * 7);
      labels.push(unit==='min'
        ? d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})
        : d.toLocaleDateString('en-US',{month:'short',day:'numeric'}));
    }
    return labels;
  }

  /* ─── LINE CHART ─── */
  const lineCtx = document.getElementById('lineChart').getContext('2d');
  let currentRange = '1D';
  let lineChart;

  function buildGradient(ctx, up) {
    const grad = ctx.createLinearGradient(0, 0, 0, 300);
    if (up) { grad.addColorStop(0,'rgba(63,185,80,.35)'); grad.addColorStop(1,'rgba(63,185,80,0)'); }
    else     { grad.addColorStop(0,'rgba(248,81,73,.35)'); grad.addColorStop(1,'rgba(248,81,73,0)'); }
    return grad;
  }

  function updateChart() {
    const labels = genLabels(currentRange);
    const pts = labels.length;
    const prices = genPrices(activeStock.price, pts);
    const up = prices[pts-1] >= prices[0];
    const color = up ? '#3fb950' : '#f85149';

    if (lineChart) lineChart.destroy();

    lineChart = new Chart(lineCtx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: prices,
          borderColor: color,
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.4,
          fill: true,
          backgroundColor: buildGradient(lineCtx, up),
        }]
      },
      options: {
        responsive: true,
        interaction: { mode:'index', intersect:false },
        plugins: {
          legend: { display:false },
          tooltip: {
            backgroundColor:'#21262d',
            titleColor:'#8b949e',
            bodyColor:'#e6edf3',
            borderColor:'#30363d',
            borderWidth:1,
            callbacks: { label: ctx => ' $' + ctx.parsed.y.toFixed(2) }
          }
        },
        scales: {
          x: { grid:{color:'#21262d'}, ticks:{color:'#8b949e', maxTicksLimit:8, font:{size:11}} },
          y: { grid:{color:'#21262d'}, ticks:{color:'#8b949e', font:{size:11}, callback:v=>'$'+v} }
        }
      }
    });
  }
  updateChart();

  /* ─── RANGE BUTTONS ─── */
  document.getElementById('rangeBtns').querySelectorAll('.range-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRange = btn.dataset.range;
      updateChart();
    });
  });

  /* ─── TRADE TABLE ─── */
  const tbody = document.getElementById('tradeTable');
  trades.forEach(t => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><strong>${t.sym}</strong></td>
      <td>$${t.price.toFixed(2)}</td>
      <td>${t.qty}</td>
      <td>$${(t.price * t.qty).toLocaleString('en-US',{minimumFractionDigits:2})}</td>
      <td><span class="badge ${t.action}">${t.action.toUpperCase()}</span></td>`;
    tbody.appendChild(row);
  });

  /* ─── PIE CHART ─── */
  const pieCtx = document.getElementById('pieChart').getContext('2d');
  new Chart(pieCtx, {
    type: 'doughnut',
    data: {
      labels: portfolio.map(p => p.label),
      datasets: [{
        data: portfolio.map(p => p.pct),
        backgroundColor: portfolio.map(p => p.color),
        borderColor: '#161b22',
        borderWidth: 3,
        hoverOffset: 8,
      }]
    },
    options: {
      cutout:'68%',
      plugins:{
        legend:{ display:false },
        tooltip:{
          backgroundColor:'#21262d',
          bodyColor:'#e6edf3',
          borderColor:'#30363d',
          borderWidth:1,
          callbacks:{ label: ctx => ` ${ctx.label}: ${ctx.parsed}%` }
        }
      }
    }
  });

  /* ─── PIE LEGEND ─── */
  const legendEl = document.getElementById('pieLegend');
  portfolio.forEach(p => {
    legendEl.innerHTML += `
      <div class="legend-item">
        <span class="legend-dot" style="background:${p.color}"></span>
        <span>${p.label}</span>
        <span class="legend-pct">${p.pct}%</span>
      </div>`;
  });

  /* ─── LIVE PRICE SIMULATION ─── */
  setInterval(() => {
    stocks.forEach(s => {
      const delta = (Math.random() - 0.495) * s.price * 0.002;
      s.price  = Math.max(1, +(s.price + delta).toFixed(2));
      s.chg    = +(s.chg + delta * 0.5).toFixed(2);
      s.pct    = +(s.pct + (Math.random() - 0.5) * 0.02).toFixed(2);
    });
    renderWatchlist();
    // refresh ticker
    tickerEl.innerHTML = '';
    [...stocks, ...stocks].forEach(s => {
      const div = document.createElement('div');
      div.className = 'ticker-item';
      const up = s.chg >= 0;
      div.innerHTML = `
        <span class="sym">${s.sym}</span>
        <span class="price">$${s.price.toFixed(2)}</span>
        <span class="chg ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(s.pct).toFixed(2)}%</span>`;
      tickerEl.appendChild(div);
    });
  }, 3000);
</script>
</body>
</html>
