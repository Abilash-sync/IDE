<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --accent: #e8ff47;
      --accent-dim: rgba(232, 255, 71, 0.12);
      --text: #f0f0f0;
      --muted: #5a5a72;
      --error: #ff4d6d;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      overflow: hidden;
      position: relative;
    }

    /* Atmospheric background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 80%, rgba(232, 255, 71, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 80% 10%, rgba(100, 80, 255, 0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Noise grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 52px 44px 44px;
      width: 100%;
      max-width: 420px;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Accent top line */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 32px; right: 32px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 0 0 4px 4px;
    }

    .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.6rem;
      letter-spacing: 0.05em;
      line-height: 1;
      color: var(--accent);
      margin-bottom: 6px;
      animation: slideUp 0.6s 0.05s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .tagline {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.02em;
      margin-bottom: 40px;
      font-weight: 300;
      animation: slideUp 0.6s 0.1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .form-group {
      margin-bottom: 20px;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .form-group:nth-child(1) { animation-delay: 0.15s; }
    .form-group:nth-child(2) { animation-delay: 0.20s; }

    label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      color: var(--muted);
      opacity: 0.6;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    input.error {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(255, 77, 109, 0.12);
    }

    .error-msg {
      font-size: 0.76rem;
      color: var(--error);
      margin-top: 6px;
      display: none;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .error-msg.visible { display: block; }

    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      animation: slideUp 0.6s 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.83rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      padding: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .forgot {
      font-size: 0.83rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot:hover { color: var(--accent); }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #0a0a0f;
      border: none;
      border-radius: 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.15rem;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      box-shadow: 0 4px 24px rgba(232, 255, 71, 0.18);
      animation: slideUp 0.6s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(232, 255, 71, 0.28);
    }

    .btn-login:active {
      transform: translateY(0);
      opacity: 0.85;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      animation: slideUp 0.6s 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .divider span { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-google {
      width: 100%;
      padding: 13px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: border-color 0.2s, background 0.2s;
      animation: slideUp 0.6s 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .btn-google:hover {
      border-color: var(--muted);
      background: rgba(255,255,255,0.03);
    }

    .btn-google svg { flex-shrink: 0; }

    .signup-row {
      text-align: center;
      margin-top: 28px;
      font-size: 0.83rem;
      color: var(--muted);
      animation: slideUp 0.6s 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .signup-row a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .signup-row a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <div class="brand">NEXUS</div>
  <p class="tagline">Sign in to your account</p>

  <form id="loginForm" novalidate>
    <div class="form-group">
      <label for="email">Email</label>
      <div class="input-wrap">
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="error-msg" id="emailError">Please enter a valid email address.</div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div class="error-msg" id="passwordError">Password must be at least 6 characters.</div>
    </div>

    <div class="options-row">
      <label class="checkbox-label">
        <input type="checkbox" name="remember" />
        Remember me
      </label>
      <a href="#" class="forgot">Forgot password?</a>
    </div>

    <button type="submit" class="btn-login">Sign In</button>
  </form>

  <div class="divider"><span>or continue with</span></div>

  <button class="btn-google" type="button">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
      <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
      <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
      <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
    </svg>
    Continue with Google
  </button>

  <p class="signup-row">Don't have an account? <a href="#">Sign up</a></p>
</div>

<script>
  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const emailError = document.getElementById('emailError');
  const passwordError = document.getElementById('passwordError');

  function validateEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
  }

  function setError(input, errorEl, show) {
    if (show) {
      input.classList.add('error');
      errorEl.classList.add('visible');
    } else {
      input.classList.remove('error');
      errorEl.classList.remove('visible');
    }
  }

  emailInput.addEventListener('input', () => {
    if (emailInput.value) setError(emailInput, emailError, !validateEmail(emailInput.value));
  });

  passwordInput.addEventListener('input', () => {
    if (passwordInput.value) setError(passwordInput, passwordError, passwordInput.value.length < 6);
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const emailOk = validateEmail(emailInput.value);
    const passOk  = passwordInput.value.length >= 6;

    setError(emailInput,    emailError,    !emailOk);
    setError(passwordInput, passwordError, !passOk);

    if (emailOk && passOk) {
      // Replace with real auth logic
      console.log('Logging in:', emailInput.value);
    }
  });
</script>
</body>
</html>
