<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Variables ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0e0d0c;
      --surface:  #171614;
      --border:   #2a2724;
      --gold:     #c9a84c;
      --gold-dim: #9b7d38;
      --text:     #e8e2d9;
      --muted:    #7a7469;
      --error:    #d4635a;
      --radius:   4px;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'DM Sans', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Noise texture overlay ───────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.035;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Ambient glow ────────────────────────────────────────── */
    .glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,168,76,0.07) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .glow-2 {
      top: auto;
      bottom: -150px;
      right: auto;
      left: -150px;
      background: radial-gradient(circle, rgba(201,168,76,0.04) 0%, transparent 70%);
      animation-duration: 15s;
      animation-direction: alternate-reverse;
    }
    @keyframes drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(30px, 20px); }
    }

    /* ── Layout ──────────────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 480px 1fr;
      grid-template-rows: 1fr auto 1fr;
      align-items: center;
      justify-items: center;
      padding: 40px 24px;
    }

    .card {
      grid-column: 2;
      grid-row: 2;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 56px 48px 48px;
      position: relative;
      opacity: 0;
      transform: translateY(24px);
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    /* gold top-bar accent */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    /* ── Brand ───────────────────────────────────────────────── */
    .brand {
      text-align: center;
      margin-bottom: 40px;
    }
    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: 1px solid var(--gold-dim);
      border-radius: 50%;
      margin-bottom: 20px;
      color: var(--gold);
      font-size: 18px;
      font-family: var(--font-display);
      font-style: italic;
      letter-spacing: 0.02em;
    }
    .brand h1 {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: 2rem;
      letter-spacing: 0.04em;
      color: var(--text);
      line-height: 1.2;
    }
    .brand p {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── Form ────────────────────────────────────────────────── */
    .form { display: flex; flex-direction: column; gap: 20px; }

    .field { display: flex; flex-direction: column; gap: 8px; }

    label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .input-wrap {
      position: relative;
    }
    .input-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      width: 15px;
      height: 15px;
      pointer-events: none;
      transition: color 0.2s;
    }
    .input-wrap input:focus ~ svg,
    .input-wrap:focus-within svg { color: var(--gold); }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 13px 14px 13px 42px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 0.02em;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    input[type="email"]:focus,
    input[type="password"]:focus,
    input[type="text"]:focus {
      border-color: var(--gold-dim);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
    }
    input[type="email"]::placeholder,
    input[type="password"]::placeholder,
    input[type="text"]::placeholder { color: #3d3a35; }

    input.invalid { border-color: var(--error); }
    .field-error {
      display: none;
      font-size: 12px;
      color: var(--error);
      margin-top: 2px;
    }
    .field-error.visible { display: block; }

    /* toggle password visibility */
    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      display: flex;
      align-items: center;
      padding: 4px;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--text); }
    .toggle-pw svg { width: 15px; height: 15px; }

    /* ── Row: remember + forgot ──────────────────────────────── */
    .form-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: -4px;
    }

    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .checkbox-wrap input[type="checkbox"] { display: none; }
    .custom-cb {
      width: 16px;
      height: 16px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    .checkbox-wrap input:checked + .custom-cb {
      background: var(--gold);
      border-color: var(--gold);
    }
    .custom-cb svg { display: none; width: 10px; height: 10px; color: #0e0d0c; }
    .checkbox-wrap input:checked + .custom-cb svg { display: block; }
    .checkbox-wrap span {
      font-size: 13px;
      font-weight: 300;
      color: var(--muted);
    }

    .forgot {
      font-size: 13px;
      font-weight: 300;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: color 0.2s;
    }
    .forgot:hover { color: var(--gold); }

    /* ── Submit button ───────────────────────────────────────── */
    .btn-primary {
      margin-top: 8px;
      padding: 14px 24px;
      background: var(--gold);
      border: none;
      border-radius: var(--radius);
      color: #0e0d0c;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-primary:hover { background: #d9b85e; }
    .btn-primary:active { transform: scale(0.985); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* shimmer on hover */
    .btn-primary::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transform: skewX(-20deg);
      transition: left 0.4s;
    }
    .btn-primary:hover::after { left: 140%; }

    /* spinner inside button */
    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #0e0d0c;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-primary.loading .btn-label { display: none; }
    .btn-primary.loading .spinner { display: block; }

    /* ── Divider ─────────────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 4px 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Social buttons ──────────────────────────────────────── */
    .social-btns { display: flex; gap: 12px; }
    .btn-social {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .btn-social:hover {
      border-color: var(--gold-dim);
      color: var(--text);
      background: rgba(201,168,76,0.04);
    }
    .btn-social svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ── Footer ──────────────────────────────────────────────── */
    .card-footer {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 13px;
      font-weight: 300;
      color: var(--muted);
    }
    .card-footer a {
      color: var(--gold);
      text-decoration: none;
      transition: color 0.2s;
    }
    .card-footer a:hover { color: #d9b85e; }

    /* ── Global alert ────────────────────────────────────────── */
    .alert {
      display: none;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 400;
      margin-top: -4px;
    }
    .alert.error {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(212, 99, 90, 0.1);
      border: 1px solid rgba(212, 99, 90, 0.3);
      color: #e8897f;
    }
    .alert.error svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 600px) {
      .page { grid-template-columns: 1fr; padding: 24px 16px; }
      .card { grid-column: 1; padding: 40px 28px 36px; }
      .social-btns { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="glow"></div>
<div class="glow glow-2"></div>

<div class="page">
  <div class="card" role="main">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-mark">A</div>
      <h1>Welcome back</h1>
      <p>Sign in to your account</p>
    </div>

    <!-- Error alert -->
    <div class="alert error" id="globalAlert" role="alert" aria-live="polite">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="alertMsg">Invalid email or password.</span>
    </div>

    <!-- Form -->
    <form class="form" id="loginForm" novalidate autocomplete="on">

      <!-- Email -->
      <div class="field">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
            aria-required="true"
            aria-describedby="emailError"
          />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M22 7l-10 7L2 7"/>
          </svg>
        </div>
        <span class="field-error" id="emailError" role="alert"></span>
      </div>

      <!-- Password -->
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
            aria-required="true"
            aria-describedby="passwordError"
          />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <span class="field-error" id="passwordError" role="alert"></span>
      </div>

      <!-- Remember + Forgot -->
      <div class="form-meta">
        <label class="checkbox-wrap">
          <input type="checkbox" id="remember" name="remember" />
          <span class="custom-cb">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="2,6 5,9 10,3"/>
            </svg>
          </span>
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-primary" id="submitBtn">
        <span class="btn-label">Sign In</span>
        <div class="spinner"></div>
      </button>

      <!-- Divider -->
      <div class="divider">or continue with</div>

      <!-- Social -->
      <div class="social-btns">
        <button type="button" class="btn-social" aria-label="Sign in with Google">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <button type="button" class="btn-social" aria-label="Sign in with GitHub">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          GitHub
        </button>
      </div>

    </form>

    <!-- Footer -->
    <div class="card-footer">
      Don't have an account? <a href="#">Create one</a>
    </div>

  </div><!-- /.card -->
</div><!-- /.page -->

<script>
  /* ── Toggle password visibility ─────────────────────────── */
  const pwInput   = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePw');
  const eyeIcon   = document.getElementById('eyeIcon');

  const eyeOpen = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  const eyeOff  = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;

  toggleBtn.addEventListener('click', () => {
    const isHidden = pwInput.type === 'password';
    pwInput.type = isHidden ? 'text' : 'password';
    eyeIcon.innerHTML = isHidden ? eyeOff : eyeOpen;
    toggleBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
  });

  /* ── Custom checkbox visual sync ────────────────────────── */
  // Already handled via CSS :checked + .custom-cb pattern — no JS needed.

  /* ── Form validation & submission ───────────────────────── */
  const form       = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const submitBtn  = document.getElementById('submitBtn');
  const globalAlert= document.getElementById('globalAlert');
  const alertMsg   = document.getElementById('alertMsg');

  function showFieldError(inputEl, errorId, message) {
    inputEl.classList.add('invalid');
    const el = document.getElementById(errorId);
    el.textContent = message;
    el.classList.add('visible');
  }
  function clearFieldError(inputEl, errorId) {
    inputEl.classList.remove('invalid');
    const el = document.getElementById(errorId);
    el.textContent = '';
    el.classList.remove('visible');
  }

  emailInput.addEventListener('input', () => clearFieldError(emailInput, 'emailError'));
  pwInput.addEventListener('input',    () => clearFieldError(pwInput, 'passwordError'));

  function validateEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    globalAlert.style.display = 'none';

    let valid = true;
    const emailVal = emailInput.value.trim();
    const pwVal    = pwInput.value;

    if (!emailVal) {
      showFieldError(emailInput, 'emailError', 'Email is required.');
      valid = false;
    } else if (!validateEmail(emailVal)) {
      showFieldError(emailInput, 'emailError', 'Enter a valid email address.');
      valid = false;
    }

    if (!pwVal) {
      showFieldError(pwInput, 'passwordError', 'Password is required.');
      valid = false;
    } else if (pwVal.length < 6) {
      showFieldError(pwInput, 'passwordError', 'Password must be at least 6 characters.');
      valid = false;
    }

    if (!valid) return;

    /* Simulate async request */
    submitBtn.classList.add('loading');
    submitBtn.disabled = true;

    await new Promise(r => setTimeout(r, 1400));

    submitBtn.classList.remove('loading');
    submitBtn.disabled = false;

    /* Demo: show error for any input (replace with real auth call) */
    globalAlert.style.display = 'flex';
    alertMsg.textContent = 'Invalid email or password. Please try again.';
    emailInput.classList.add('invalid');
    pwInput.classList.add('invalid');
  });
</script>
</body>
</html>
