<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d0f;
      --surface:   #13131a;
      --border:    rgba(255,255,255,.08);
      --accent:    #c8ff57;
      --accent-dk: #a8d940;
      --text:      #f0f0ee;
      --muted:     #6b6b7a;
      --error:     #ff6b6b;
      --radius:    14px;
      --trans:     .25s cubic-bezier(.4,0,.2,1);
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ── Background grid ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(200,255,87,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,255,87,.04) 1px, transparent 1px);
      background-size: 56px 56px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Glow orb ── */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(200,255,87,.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 44px 44px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.03),
        0 40px 80px rgba(0,0,0,.6),
        0 0 60px rgba(200,255,87,.04);
      animation: cardIn .55s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(.97); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }

    /* ── Logotype ── */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent);
      display: grid;
      place-items: center;
    }

    .brand-mark svg { display: block; }

    .brand-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.2rem;
      letter-spacing: -.01em;
      color: var(--text);
    }

    /* ── Heading ── */
    .heading {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      line-height: 1.1;
      letter-spacing: -.03em;
      color: var(--text);
      margin-bottom: 8px;
    }

    .heading em {
      font-style: italic;
      color: var(--accent);
    }

    .subheading {
      font-size: .875rem;
      color: var(--muted);
      font-weight: 300;
      margin-bottom: 36px;
      line-height: 1.5;
    }

    /* ── Form ── */
    .form { display: flex; flex-direction: column; gap: 18px; }

    .field { display: flex; flex-direction: column; gap: 7px; }

    label {
      font-size: .78rem;
      font-weight: 500;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .input-wrap { position: relative; }

    .input-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      opacity: .4;
      pointer-events: none;
      transition: opacity var(--trans);
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      height: 48px;
      padding: 0 42px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      outline: none;
      transition: border-color var(--trans), background var(--trans), box-shadow var(--trans);
    }

    input:focus {
      border-color: var(--accent);
      background: rgba(200,255,87,.05);
      box-shadow: 0 0 0 3px rgba(200,255,87,.12);
    }

    input:focus ~ svg,
    .input-wrap:has(input:focus) svg { opacity: .9; }

    input.error { border-color: var(--error); box-shadow: 0 0 0 3px rgba(255,107,107,.14); }

    .error-msg {
      font-size: .78rem;
      color: var(--error);
      display: none;
    }

    .error-msg.show { display: block; }

    /* Toggle password */
    .eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      line-height: 0;
      transition: color var(--trans);
    }
    .eye-btn:hover { color: var(--text); }

    /* ── Options row ── */
    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: -4px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: .82rem;
      color: var(--muted);
      user-select: none;
    }

    .remember input[type="checkbox"] { display: none; }

    .checkmark {
      width: 17px;
      height: 17px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: rgba(255,255,255,.04);
      position: relative;
      transition: border-color var(--trans), background var(--trans);
      flex-shrink: 0;
    }

    .remember input:checked + .checkmark {
      background: var(--accent);
      border-color: var(--accent);
    }

    .checkmark::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 5px;
      width: 5px;
      height: 9px;
      border: 2px solid #0d0d0f;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
      opacity: 0;
      transition: opacity var(--trans);
    }

    .remember input:checked + .checkmark::after { opacity: 1; }

    .forgot {
      font-size: .82rem;
      color: var(--muted);
      text-decoration: none;
      transition: color var(--trans);
    }
    .forgot:hover { color: var(--accent); }

    /* ── Submit button ── */
    .btn-submit {
      height: 50px;
      width: 100%;
      background: var(--accent);
      color: #0d0d0f;
      border: none;
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      font-weight: 500;
      letter-spacing: .02em;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background var(--trans), transform var(--trans), box-shadow var(--trans);
    }

    .btn-submit:hover {
      background: var(--accent-dk);
      box-shadow: 0 8px 24px rgba(200,255,87,.25);
      transform: translateY(-1px);
    }

    .btn-submit:active { transform: translateY(0); box-shadow: none; }

    .btn-submit .btn-text { position: relative; z-index: 1; }

    /* Loading spinner */
    .btn-submit .spinner {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
    }
    .btn-submit.loading .btn-text { opacity: 0; }
    .btn-submit.loading .spinner  { display: flex; }

    .spinner-ring {
      width: 20px; height: 20px;
      border: 2px solid rgba(0,0,0,.2);
      border-top-color: #0d0d0f;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--muted);
      font-size: .75rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Social buttons ── */
    .socials { display: flex; gap: 12px; }

    .btn-social {
      flex: 1;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .82rem;
      font-weight: 400;
      cursor: pointer;
      transition: background var(--trans), border-color var(--trans);
      text-decoration: none;
    }

    .btn-social:hover {
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.16);
    }

    /* ── Footer ── */
    .footer-link {
      text-align: center;
      font-size: .82rem;
      color: var(--muted);
    }

    .footer-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: opacity var(--trans);
    }

    .footer-link a:hover { opacity: .75; }

    /* ── Success state ── */
    .success-overlay {
      display: none;
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: var(--surface);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      animation: fadeIn .3s ease both;
    }

    .success-overlay.show { display: flex; }

    .success-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(200,255,87,.12);
      border: 2px solid var(--accent);
      display: grid;
      place-items: center;
      animation: popIn .4s cubic-bezier(.34,1.56,.64,1) .1s both;
    }

    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .success-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      color: var(--text);
    }

    .success-sub { font-size: .85rem; color: var(--muted); }
  </style>
</head>
<body>

<div class="page">
  <div class="card" style="position:relative;">

    <!-- Success overlay -->
    <div class="success-overlay" id="successOverlay">
      <div class="success-icon">
        <svg width="28" height="28" fill="none" stroke="#c8ff57" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="success-title">Welcome back!</div>
      <div class="success-sub">Redirecting you to the dashboard…</div>
    </div>

    <!-- Brand -->
    <div class="brand">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M9 2L16 6.5V11.5L9 16L2 11.5V6.5L9 2Z" fill="#0d0d0f"/>
        </svg>
      </div>
      <span class="brand-name">Nexus</span>
    </div>

    <!-- Heading -->
    <h1 class="heading">Sign <em>in</em></h1>
    <p class="subheading">Enter your credentials to continue.</p>

    <!-- Form -->
    <form class="form" id="loginForm" novalidate>

      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <rect x="2" y="4" width="20" height="16" rx="3"/>
            <path d="M2 7l10 7 10-7"/>
          </svg>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <span class="error-msg" id="emailErr">Please enter a valid email address.</span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="eye-btn" id="eyeBtn" aria-label="Toggle password visibility">
            <svg id="eyeIcon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <span class="error-msg" id="passErr">Password must be at least 6 characters.</span>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="remember" />
          <span class="checkmark"></span>
          Remember me
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="btn-text">Sign in</span>
        <span class="spinner"><span class="spinner-ring"></span></span>
      </button>

      <div class="divider">or continue with</div>

      <div class="socials">
        <a href="#" class="btn-social">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </a>
        <a href="#" class="btn-social">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          GitHub
        </a>
      </div>

      <p class="footer-link">No account? <a href="#">Create one</a></p>

    </form>
  </div>
</div>

<script>
  // Toggle password visibility
  const eyeBtn  = document.getElementById('eyeBtn');
  const passInp = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');

  eyeBtn.addEventListener('click', () => {
    const show = passInp.type === 'password';
    passInp.type = show ? 'text' : 'password';
    eyeIcon.innerHTML = show
      ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
         <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
         <line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
         <circle cx="12" cy="12" r="3"/>`;
  });

  // Form validation & submission
  const form      = document.getElementById('loginForm');
  const emailInp  = document.getElementById('email');
  const emailErr  = document.getElementById('emailErr');
  const passErr   = document.getElementById('passErr');
  const submitBtn = document.getElementById('submitBtn');
  const overlay   = document.getElementById('successOverlay');

  function validateEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    let valid = true;

    // Email
    if (!validateEmail(emailInp.value.trim())) {
      emailInp.classList.add('error');
      emailErr.classList.add('show');
      valid = false;
    } else {
      emailInp.classList.remove('error');
      emailErr.classList.remove('show');
    }

    // Password
    if (passInp.value.length < 6) {
      passInp.classList.add('error');
      passErr.classList.add('show');
      valid = false;
    } else {
      passInp.classList.remove('error');
      passErr.classList.remove('show');
    }

    if (!valid) return;

    // Simulate async login
    submitBtn.classList.add('loading');
    submitBtn.disabled = true;

    setTimeout(() => {
      submitBtn.classList.remove('loading');
      submitBtn.disabled = false;
      overlay.classList.add('show');
    }, 1800);
  });

  // Live validation clear
  emailInp.addEventListener('input', () => {
    if (validateEmail(emailInp.value.trim())) {
      emailInp.classList.remove('error');
      emailErr.classList.remove('show');
    }
  });

  passInp.addEventListener('input', () => {
    if (passInp.value.length >= 6) {
      passInp.classList.remove('error');
      passErr.classList.remove('show');
    }
  });
</script>
</body>
</html>
